<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تهانينا! أنت الآن سفير لطموح</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --navy: #0a192f; --orange: #ff6b00; --bg: #fdfaf7; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; max-width: 450px; border-left: 8px solid var(--orange); border-right: 8px solid var(--orange); animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; transform: scale(0); }
        @keyframes popIn { to { transform: scale(1); } }
        h1 { color: var(--navy); font-size: 2rem; margin-bottom: 10px; }
        .msg { color: #666; font-size: 1.1rem; line-height: 1.6; margin-bottom: 25px; }
        .badge { display: inline-block; background: var(--navy); color: white; padding: 10px 25px; border-radius: 8px; font-weight: bold; font-size: 1.2rem; border-bottom: 4px solid var(--orange); }
        .emoji { font-size: 3rem; margin-bottom: 10px; }
        .btn-join { background: #4CAF50; color: white; text-decoration: none; padding: 12px 30px; border-radius: 10px; display: inline-block; margin-top: 25px; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3); }
        .btn-join:hover { background: var(--navy); transform: translateY(-3px); box-shadow: 0 6px 15px rgba(10, 25, 47, 0.3); }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">🤝🌟</div>
        <h1>أهلاً بك يا <span id="name">بطل الأثر</span>!</h1>
        <p class="msg">لأنك تحمل روح المبادرة وشغف العمل الجماعي، يسعدنا إعلامك بأنه تم قبولك رسمياً لتكون سفير "طموح" ويدها المعطاءة في الميدان.</p>
        <div class="badge">متطوع ميداني (Social Affairs)</div>
        <br>
        <a href="https://t.me/+TEXEtCombmxhZmQ0" class="btn-join" target="_blank">انضم لمجموعة العمل 🤝</a>
        <p style="margin-top: 25px; color: #888; font-style: italic; font-size: 0.9rem;">"لنكن البداية، وليكن طموحنا قصة نجاح"</p>
    </div>
    <script>
        const name = new URLSearchParams(window.location.search).get('name') || "بطل الأثر";
        document.getElementById('name').innerText = name;
        setTimeout(() => confetti({ particleCount: 120, spread: 100, origin: { y: 0.8 }, colors: ['#ff6b00', '#0a192f', '#4CAF50'] }), 600);
    </script>
</body>
</html>
